name: Reusable standalone AXOLOTL module build

on:
  workflow_call:
    inputs:
      gradle-task:
        description: Gradle task that assembles the standalone module APK
        required: false
        type: string
        default: assembleDebug
      artifact-path:
        description: APK glob produced by the module project
        required: false
        type: string
        default: "**/build/outputs/apk/debug/*.apk"

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile standalone module
        run: gradle --no-daemon --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true ${{ inputs.gradle-task }}
      - name: Upload module APK
        uses: actions/upload-artifact@v4
        with:
          name: axolotl-module-${{ github.sha }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14
